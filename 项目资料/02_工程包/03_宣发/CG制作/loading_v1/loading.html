<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>暗岩传说：深渊回响 · 载入画面 v1 演示</title>
<link rel="preload" as="image" href="assets/n1_base.webp">
<link rel="stylesheet" href="loading.css">
<style>
  html,body{margin:0;height:100%;background:#000;color:#9fb3ae;font-family:"Noto Serif SC","Songti SC",serif}
  #game{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
    background:radial-gradient(ellipse at 50% 60%,#14262a,#05080a 70%)}
  #game h1{margin:0;font-weight:400;letter-spacing:.4em;font-size:18px;color:#c9b48a}
  #game button{font:13px/1 Georgia,serif;letter-spacing:.25em;color:#e2c48a;background:rgba(0,0,0,.35);
    border:1px solid rgba(201,150,90,.5);padding:10px 18px;cursor:pointer}
  #game small{opacity:.55;letter-spacing:.15em}
</style>
</head>
<body>
<div id="game">
  <h1>（ 游 戏 画 面 ）</h1>
  <button id="replay">重播 · REPLAY</button>
  <small id="hint"></small>
</div>

<!-- ↓↓↓ 载入画面静态标记：放在 <body> 最前面，脚本还没跑时 LOGO 也会用纯 CSS 浮现 ↓↓↓ -->
<div id="anyan-loader" role="status" aria-label="加载中">
  <div class="al-bg"></div>
  <div class="al-stage">
    <div class="al-logo" aria-hidden="true">
      <canvas class="al-ring"></canvas>
      <img class="al-base" alt="" src="assets/n1_base.webp">
      <img class="al-glow" alt="" src="assets/n1_glow.webp">
      <img class="al-gold" alt="" src="assets/n1_gold.webp">
      <img class="al-hot"  alt="" src="assets/n1_glow.webp">
    </div>
    <div class="al-barwrap">
      <div class="al-bar"><div class="al-track"><div class="al-fill"></div></div><div class="al-head"></div></div>
      <div class="al-meta"><span class="al-stagetxt">正在接收资源…</span><span class="al-pct">0%</span></div>
    </div>
    <div class="al-tip" aria-live="polite"><div class="al-tip-en">The bell has stopped.</div><div class="al-tip-zh">钟，停了。</div></div>
  </div>
  <div class="al-vig"></div><div class="al-flash"></div><canvas class="al-fx"></canvas>
</div>
<!-- ↑↑↑ 载入画面静态标记 ↑↑↑ -->

<script src="loading.js"></script>
<script>
/* ---- 演示：模拟 0→100% 约 8 秒（不均匀步进，像真实加载），结束后 3 秒自动重播；
        URL 参数：?once 不自动重播  ?rm 强制「减少动态效果」  ?dur=8000 模拟时长(ms) ---- */
(function () {
  var qs = new URLSearchParams(location.search);
  var DUR = +qs.get('dur') || 8000, ONCE = qs.has('once'), RM = qs.has('rm') ? true : undefined;
  var STAGES = ['正在接收资源…', '角色模型 · 1/5', '怪物模型 · 2/5', '场景模型 · 3/5', '高精贴图 · 4/5', '预编译着色器 · 5/5'];
  var timer = 0, autoT = 0;
  function run() {
    clearTimeout(autoT);
    if (!document.getElementById('anyan-loader')) {        // 重播：重新挂载（show() 会自建标记）
      var d = document.createElement('div'); d.id = 'anyan-loader'; document.body.appendChild(d);
    }
    AnyanLoader.show({ assetBase: 'assets/', reducedMotion: RM });
    var t0 = performance.now(), p = 0;
    (function step() {
      var e = (performance.now() - t0) / DUR;
      // 不均匀：偶尔停顿、偶尔跳一截
      var target = Math.min(1, e + 0.04 * Math.sin(e * 9));
      if (Math.random() < 0.25) p = Math.max(p, target);
      AnyanLoader.setProgress(p);
      AnyanLoader.setStage(STAGES[Math.min(STAGES.length - 1, Math.floor(p * STAGES.length))]);
      if (e < 1) timer = setTimeout(step, 90 + Math.random() * 160);
      else AnyanLoader.setProgress(1), AnyanLoader.finish(function () {
        document.getElementById('hint').textContent = ONCE ? '' : '3 秒后自动重播';
        if (!ONCE) autoT = setTimeout(run, 3000);
      });
    })();
  }
  document.getElementById('replay').onclick = function () { clearTimeout(timer); AnyanLoader.destroy(); run(); };
  run();
})();
</script>
</body>
</html>
