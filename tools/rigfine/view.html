<!doctype html><html><body style="margin:0;background:#333">
<script type="importmap">{"imports":{"three":"./three/build/three.module.js","three/addons/":"./three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
const R = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); R.setSize(480, 480); document.body.appendChild(R.domElement);
R.shadowMap.enabled = true; R.outputColorSpace = THREE.SRGBColorSpace;
const S = new THREE.Scene(); S.background = new THREE.Color(0x3a3d42);
const cam = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
S.add(new THREE.HemisphereLight(0xdfe8f0, 0x403830, 1.6));
const sun = new THREE.DirectionalLight(0xfff2e0, 2.2); sun.position.set(3, 6, 4); sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024); S.add(sun);
const gnd = new THREE.Mesh(new THREE.CircleGeometry(3, 48), new THREE.MeshStandardMaterial({ color: 0x5a5148, roughness: 1 })); gnd.rotation.x = -Math.PI / 2; gnd.receiveShadow = true; S.add(gnd);
const rig = await (await fetch(new URLSearchParams(location.search).get('rig'))).json();
const gl = await new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).loadAsync(new URLSearchParams(location.search).get('glb'));
let src; gl.scene.traverse(o => { if (o.isMesh) src = o; });
const geo = src.geometry.clone();
geo.setIndex(rig.index);
geo.setAttribute('skinIndex', new THREE.Uint16BufferAttribute(rig.si, 4));
geo.setAttribute('skinWeight', new THREE.Float32BufferAttribute(rig.sw, 4));
const bones = {}, list = [];
for (const b of rig.bones) { const o = new THREE.Bone(); o.name = b.name; const pp = b.parent ? rig.bones.find(x => x.name === b.parent).p : [0, 0, 0]; o.position.set(b.p[0] - pp[0], b.p[1] - pp[1], b.p[2] - pp[2]); if (b.parent) bones[b.parent].add(o); bones[b.name] = o; list.push(o); }
const mat = src.material; if (new URLSearchParams(location.search).get('wire')) mat.wireframe = true;
const sm = new THREE.SkinnedMesh(geo, mat); sm.add(bones.root); sm.bind(new THREE.Skeleton(list)); sm.castShadow = true; sm.frustumCulled = false;
const holder = new THREE.Group(); holder.add(sm); sm.position.copy(src.position); sm.scale.copy(src.scale); sm.quaternion.copy(src.quaternion);
// 站到地面：模型 y∈[-1,1]×scale
holder.position.y = 1 * src.scale.y - src.position.y * 0; S.add(holder);
const H = 2 * src.scale.y;
holder.scale.setScalar(1.9 / H); holder.position.y = 1.9 / 2;
holder.rotation.y = -0.5;
cam.position.set(0.6, 1.4, 4.6); cam.lookAt(0, 0.95, 0);
const K = (1.9 / H) * src.scale.y;
const rest = {}; for (const k in bones) rest[k] = bones[k].position.clone();
function reset() { for (const k in bones) { bones[k].rotation.set(0, 0, 0); bones[k].position.copy(rest[k]); } holder.rotation.set(0, -0.5, 0); holder.position.set(0, 1.9 / 2, 0); }
const r = (k, x = 0, y = 0, z = 0) => { const b = bones[k]; if (!b) return; b.rotation.x += x; b.rotation.y += y; b.rotation.z += z; };
const sm3 = u => u <= 0 ? 0 : u >= 1 ? 1 : u * u * (3 - 2 * u);
window.pose = (ph, t) => {
  reset();
  const br = Math.sin(t * 2 * Math.PI / 2.6);
  r('chest', br * 0.025); r('neck', -br * 0.015); r('uarmR', 0, 0, -0.03 * br); r('uarmL', 0, 0, 0.03 * br);
  if (bones.robe1) { // 漂浮体：裙摆随时间摆、整体上下浮
    const w = Math.sin(t * 2 * Math.PI / 1.8), mv = ph === 'walk' ? 1 : 0.4;
    r('robe1', (0.06 + 0.1 * mv) * w + (ph === 'walk' ? 0.18 : 0)); r('robe2', 0.12 * mv * Math.sin(t * 2 * Math.PI / 1.8 - 0.8)); r('robe3', 0.16 * mv * Math.sin(t * 2 * Math.PI / 1.8 - 1.6));
    bones.root.position.y = rest.root.y + 0.03 * Math.sin(t * 2 * Math.PI / 2.2) / K;
    if (ph === 'walk') r('chest', 0.12);
  }
  if (ph === 'walk') {
    const p = t / 1.1 * 2 * Math.PI, s = Math.sin(p), c = Math.cos(p);
    r('thighR', -0.42 * s); r('thighL', 0.42 * s);
    r('shinR', 0.65 * Math.max(0, Math.sin(p + 2.0))); r('shinL', 0.65 * Math.max(0, Math.sin(p + 2.0 + Math.PI)));
    r('footR', 0.2 * s); r('footL', -0.2 * s);
    r('uarmL', -0.28 * s); r('farmL', -0.15 - 0.1 * Math.max(0, -s)); r('uarmR', 0.08 * s); r('farmR', -0.05);
    r('hips', 0, 0.07 * s, 0); r('chest', 0.05, -0.1 * s, 0);
    bones.root.position.y = rest.root.y + (Math.abs(c) * 0.02 - 0.012) / K;
  }
  if (ph === 'atk') { // 0..0.5 预备, 0.5..0.68 出手, 0.68..1.3 收招
    const pre = sm3(t / 0.5), str = sm3((t - 0.5) / 0.18), rec = sm3((t - 0.75) / 0.55);
    const P = pre * (1 - str), Q = str * (1 - rec);
    r('uarmR', 0.75 * P - 1.55 * Q, 0, -0.25 * P - 0.15 * Q); r('farmR', -0.5 * P - 0.25 * Q);
    r('chest', -0.12 * P + 0.25 * Q, -0.45 * P + 0.4 * Q, 0); r('spine', -0.05 * P + 0.12 * Q, -0.15 * P + 0.15 * Q, 0);
    r('neck', 0.05 * P - 0.1 * Q, 0.3 * P - 0.25 * Q);
    r('uarmL', -0.25 * P + 0.3 * Q, 0, 0.15 * P); r('farmL', -0.3 * P);
    r('thighR', 0.18 * P - 0.35 * Q); r('shinR', 0.15 * P + 0.3 * Q); r('thighL', -0.2 * P + 0.15 * Q); r('shinL', 0.2 * P);
    r('hips', 0, -0.15 * P + 0.15 * Q, 0);
  }
  if (ph === 'death' && bones.robe1) { // 漂浮体死亡：前俯、双臂垂下、整体下沉塌进裙摆
    const k = sm3(t / 1.0);
    r('chest', 0.5 * k); r('spine', 0.25 * k); r('neck', 0.35 * k); r('uarmR', 0.6 * k, 0, 0.3 * k); r('uarmL', 0.6 * k, 0, -0.3 * k);
    r('robe1', -0.15 * k); r('robe2', 0.25 * k); r('robe3', 0.3 * k);
    holder.position.y = 1.9 / 2 - 0.55 * k; holder.rotation.x = 0.15 * k; holder.scale.setScalar((1.9 / H) * (1 - 0.0 * k));
    R.render(S, cam); return;
  }
  if (ph === 'death') {
    const kn = sm3(t / 0.5), f = sm3((t - 0.35) / 0.75);
    r('thighR', -0.9 * kn); r('thighL', -0.75 * kn); r('shinR', 1.5 * kn); r('shinL', 1.35 * kn); r('footR', -0.5 * kn); r('footL', -0.5 * kn);
    r('chest', 0.3 * kn + 0.2 * f); r('neck', 0.25 * kn); r('uarmR', -0.3 * kn, 0, -0.2 * kn); r('uarmL', -0.4 * kn, 0, 0.3 * kn);
    bones.root.position.y = rest.root.y - 0.38 * kn / K * (1 - f * 0.4);
    holder.rotation.x = 1.35 * f * f; holder.position.y = 1.9 / 2 - (0.9 - 0.12) * f * f * 0 ;
    // 绕脚尖前倒：holder 原点在模型中心，补位移
    const ang = 1.35 * f * f, hc = 1.9 / 2 - 0.38 * kn * 0.6;
    holder.position.y = 1.9 / 2 - hc + hc * Math.cos(ang) + 0.08 * Math.sin(ang); holder.position.z = hc * Math.sin(ang) * 0.9;
  }
  R.render(S, cam);
};
// 关键帧动作：?clips=xxx.json，格式 {名: {dur, loop?, keys:[{t, b:{骨:[x,y,z]}, dy?, dz?, ry?, rx?}]}}
const cq = new URLSearchParams(location.search).get('clips');
const CL = cq ? await (await fetch(cq)).json() : {};
const lab = document.createElement('div'); lab.style.cssText = 'position:fixed;left:10px;top:8px;color:#eee;font:bold 18px sans-serif;text-shadow:0 0 3px #000'; document.body.appendChild(lab);
window.clip = (name, t) => {
  const c = CL[name]; reset(); lab.textContent = c.label || name;
  const br = Math.sin(t * 2 * Math.PI / 2.6); r('chest', br * 0.02); r('neck', -br * 0.012);
  const ks = c.keys; let i = 0; while (i < ks.length - 1 && ks[i + 1].t <= t) i++;
  const a = ks[i], b = ks[Math.min(i + 1, ks.length - 1)], u = b === a ? 0 : sm3((t - a.t) / (b.t - a.t));
  const names = new Set([...Object.keys(a.b || {}), ...Object.keys(b.b || {})]);
  for (const n of names) { const va = (a.b || {})[n] || [0, 0, 0], vb = (b.b || {})[n] || [0, 0, 0]; r(n, va[0] + (vb[0] - va[0]) * u, va[1] + (vb[1] - va[1]) * u, va[2] + (vb[2] - va[2]) * u); }
  const L = k => (a[k] || 0) + ((b[k] || 0) - (a[k] || 0)) * u;
  bones.root.position.y = rest.root.y + L('dy') / K; holder.position.z = L('dz'); holder.rotation.y = -0.5 + L('ry'); holder.rotation.x = L('rx');
  R.render(S, cam);
};
window.ready = true; pose('idle', 0);
</script></body></html>
