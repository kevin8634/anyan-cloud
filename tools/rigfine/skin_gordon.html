<html><body style="margin:0;background:#2a2d33"><script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
<script type="module">

import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {MeshoptDecoder} from 'three/addons/libs/meshopt_decoder.module.js';
const U=new URLSearchParams(location.search),W=+U.get('w')||640,HH=+U.get('h')||640;

 else if(n==='side'){C.position.set(ct.x+D,ct.y,ct.z);C.lookAt(ct);}

 else if(n==='torso'){const t=new THREE.Vector3(ct.x,box.max.y-H*0.3,ct.z);C.position.set(t.x+H*0.25,t.y+H*0.05,t.z+H*0.9);C.lookAt(t);}
 else if(n==='rarm'){const h=B.RightForeArm?B.RightForeArm.getWorldPosition(new THREE.Vector3()):ct;C.position.set(h.x,h.y+H*0.12,h.z+H*0.55);C.lookAt(h);}
 else if(n.startsWith('waist')){const h=B.Hips?B.Hips.getWorldPosition(new THREE.Vector3()):ct;const t=new THREE.Vector3(h.x,h.y+H*0.02,h.z);const o={waist:[0.08,0.04,0.5],waist_s:[0.5,0.04,0.08],waist_b:[-0.1,0.04,-0.5],waist_q:[0.36,0.06,0.36],waist_r:[-0.5,0.04,0.08],waist_rq:[-0.36,0.06,0.36]}[n]||[0,0,0.5];C.position.set(t.x+H*o[0],t.y+H*o[1],t.z+H*o[2]);C.lookAt(t);}
 else if(n.startsWith('hood')){const h=head||new THREE.Vector3(ct.x,box.max.y-H*0.08,ct.z);const t=new THREE.Vector3(h.x,h.y+H*0.04,h.z);const o={hood:[0,0.02,0.3],hood_l:[0.17,0.03,0.24],hood_r:[-0.17,0.03,0.24],hood_t:[0,0.2,0.22]}[n]||[0,0,0.3];C.position.set(t.x+H*o[0],t.y+H*o[1],t.z+H*o[2]);C.lookAt(t);}
 else {C.position.set(ct.x+D*0.55,ct.y+H*0.1,ct.z+D*0.85);C.lookAt(ct);}

const e=new THREE.Euler(),q=new THREE.Quaternion();
function set(n,x,y,z){const b=B[n];if(!b)return;e.set(x,y,z);q.setFromEuler(e);b.quaternion.copy(Q[n]).multiply(q);}
